<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка Артиста — TIMYS</title>
    <style>
        /* Сброс стилей и общие настройки */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #060b13; /* Очень глубокий темный фон */
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            width: 100%;
            max-width: 100vw;
        }

        /* Главный контейнер карточки */
        .artist-card {
            background-color: #030710;
            border: 2px solid rgba(0, 162, 255, 0.25);
            max-width: 1050px;
            width: 100%;
            display: flex;
            flex-direction: row;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 183, 255, 0.1);
            padding: 30px;
            gap: 30px;
            margin: auto 0; /* Обеспечивает центровку внутри body */
        }

        /* Левая часть: информация и описание */
        .artist-info {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Заголовок (Артист + Имя + QR-код напротив) */
        .artist-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .artist-role {
            font-size: 0.85rem;
            color: #00e1d9; /* Неоновый бирюзовый */
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .artist-name {
            font-size: 3.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            line-height: 1;
        }

        /* Контейнер для QR-кода */
        .qr-wrapper {
            width: 110px;
            height: 110px;
            border: 2px solid #00e1d9;
            border-radius: 12px;
            padding: 8px;
            background-color: transparent;
            box-shadow: 0 0 15px rgba(0, 225, 217, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .qr-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: invert(1) hue-rotate(140deg) brightness(1.2); /* Неоновый эффект */
        }

        /* Таблица с характеристиками */
        .stats-container {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        .stats-row {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            padding: 16px 0;
            align-items: center;
        }

        .stats-label {
            font-size: 0.8rem;
            color: #52667d;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .stats-value {
            font-size: 0.95rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Краткое описание */
        .artist-description {
            font-size: 0.95rem;
            color: #8c9ba5;
            line-height: 1.6;
            margin-bottom: 25px;
            border-left: 3px solid #00e1d9;
            padding-left: 15px;
        }

        /* Секция социальных сетей */
        .socials-section {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .socials-label {
            font-size: 0.8rem;
            color: #00e1d9;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .socials-icons {
            display: flex;
            gap: 18px;
        }

        .socials-icons a {
            color: #00e1d9;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .socials-icons a:hover {
            transform: translateY(-3px);
            filter: drop-shadow(0 0 8px #00e1d9);
            color: #ffffff;
        }

        .socials-icons svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Правая часть: фото артиста в неоновой рамке */
        .artist-image-frame {
            flex: 1;
            max-width: 480px;
            background-color: #02050b;
            border: 2px solid rgba(0, 225, 217, 0.4);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 225, 217, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .artist-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* Футер копирайта */
        .artist-footer {
            width: 100%;
            text-align: center;
            padding: 20px 0 10px;
            color: rgba(0, 225, 217, 0.6);
            font-size: 13px;
            letter-spacing: 1px;
            font-family: 'Segoe UI', sans-serif;
            margin-top: auto; /* Позволяет футеру быть в самом низу */
        }

        /* Адаптивный дизайн */
        @media (max-width: 900px) {
            .artist-card {
                flex-direction: column;
                padding: 20px;
                gap: 25px;
            }

            .artist-image-frame {
                max-width: 100%;
                height: 480px;
                order: -1; /* Фото уходит наверх */
            }

            .artist-name {
                font-size: 3rem;
            }
        }

        /* Тонкая настройка для экранов смартфонов */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .artist-card {
                padding: 15px;
                gap: 20px;
            }

            .artist-image-frame {
                height: 320px; /* Уменьшаем высоту фото на маленьких экранах */
            }

            .artist-header-container {
                flex-direction: row; /* Оставляем QR сбоку, чтобы не занимать много места по вертикали */
                justify-content: space-between;
                align-items: center;
            }

            .qr-wrapper {
                width: 75px;
                height: 75px;
                padding: 5px;
            }

            .artist-name {
                font-size: 2.2rem;
            }

            .artist-description {
                font-size: 0.9rem;
                padding-left: 10px;
            }

            .stats-row {
                padding: 12px 0;
            }

            .stats-label {
                font-size: 0.75rem;
            }

            .stats-value {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
